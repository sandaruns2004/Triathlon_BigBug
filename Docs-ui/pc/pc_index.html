function shell(){return `<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="${A}brand/waypoint-flow-mark.svg" alt=""> <div>Waypoint Flow<small>CONNECTED OPERATIONS</small></div></div><div class="nav-caption">WORKSPACE</div>${nav('operations','Operations','grid',exceptions.length)}${nav('planning','Planning','route')}${nav('loading','Load board','truck')}<div class="nav-caption" style="margin-top:23px">STORE WORKSPACE</div>${nav('orders','Orders','box')}${nav('tracking','Tracking & receipt','pin')}<div class="nav-caption" style="margin-top:23px">DIRECTORY</div>${nav('outlets','Outlets','store')}${nav('fleet','Fleet','truck')}${nav('reports','Reports','chart')}<div class="sidebar-bottom"><div class="depot-note"><span class="status-dot"></span><strong>All systems operational</strong><br><span class="muted">Your team. One connected flow.</span></div><button class="nav-item" data-action="help">${icon('help')}Help & support</button><div class="profile"><div class="avatar">AP</div><div><strong>Anjali Perera</strong><small>Dispatcher · Demo workspace</small></div><button class="ghost small" data-view="auth" aria-label="Open sign in">${icon('logout')}</button></div></div></aside><div class="workspace"><header class="topbar"><div class="top-left"><button class="ghost mobile-menu small" data-action="menu" aria-label="Toggle navigation">${icon('menu')}</button>${icon('calendar')}<span>Tuesday, 21 April 2026</span><div class="separator"></div>${icon('pin')}<select id="depot" aria-label="Filter by depot"><option>All depots</option><option>Peliyagoda</option><option>Kandy</option></select></div><div class="top-right"><label class="search">${icon('search')}<input id="global-search" placeholder="Search trips, outlets…" aria-label="Search trips and outlets" value="${escapeHTML(search)}"><span class="kbd">/</span></label><span class="live"><span class="status-dot"></span>Demo data</span><button class="ghost small bell" data-action="notifications" aria-label="View notifications">${icon('bell')}</button><div class="separator"></div><div class="avatar">AP</div></div></header><main id="main">${content()}<footer class="page-footer"><span>${icon('shield')} Waypoint Flow · Connected delivery operations</span><span>Sample operating day · All times Sri Lanka (UTC+5:30)</span></footer></main></div></div>`}
function header(title,sub,action=''){return `<div class="page-header"><div><div class="eyebrow">${['orders','tracking'].includes(view)?'Store workspace':'Distribution workspace'}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function content(){return ({operations:operations,planning:planning,loading:loading,orders:composer,tracking:tracking,outlets:directory,fleet:directory,reports:reports}[view]||operations)()}
function metrics(){const values=[['Orders planned','108','/ 120','90% of today’s orders','box','All trips'],['Vehicles dispatched','24','/ 32','8 vehicles preparing to depart','truck','On route'],['On-time forecast','94.2','%','↑ 2.1% from yesterday','clock','All trips'],['Orders at risk','7','','3 delivery windows affected','alert','At risk'],['Open exceptions',String(exceptions.length),'','Your attention is needed','grid','exceptions']];return `<div class="metrics">${values.map((m,i)=>`<button class="metric" data-metric="${m[5]}"><div class="metric-label">${m[0]}${icon(m[4])}</div><div class="metric-value ${i>2?'warn':''}">${m[1]}<span>${m[2]}</span></div><div class="metric-note ${i===2?'good':''}">${m[3]}</div></button>`).join('')}</div>`}
function routeMap(){return `<section class="panel"><div class="panel-head"><div><h2>Live route overview</h2><p>Western Province · ${visibleTrips().filter(t=>t.depot==='Peliyagoda').length} sample vehicles in view</p></div><span class="live"><span class="status-dot"></span>Route snapshot</span></div><div class="map"><svg class="base-map" viewBox="0 0 740 310" preserveAspectRatio="xMidYMid slice" aria-label="Schematic route map around Colombo, linked to the trips below" role="img"><defs><pattern id="blocks" width="95" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-17)"><rect width="95" height="80" fill="#edf0e8"/><rect x="5" y="6" width="38" height="28" rx="3" fill="#e4e9df"/><rect x="50" y="8" width="37" height="58" rx="4" fill="#e6ebdf"/><path d="M0 74H95 M46 0V80" stroke="#fafbf7" stroke-width="5"/></pattern></defs><rect width="740" height="310" fill="url(#blocks)"/><path d="M0 0H129L121 42 137 90 122 135 137 172 122 215 139 269 127 310H0Z" fill="#d8e7e5"/><path d="M128 0 152 55 148 112 177 184 162 252 192 310 M174 0 223 52 277 82 338 134 374 207 406 310 M305 0 307 53 354 113 460 153 550 194 643 239 740 256 M137 220 258 202 330 220 456 248 585 270 740 294 M438 0 410 52 405 102 429 182 425 310 M141 107 260 118 374 90 500 95 627 67 740 89" fill="none" stroke="#d6ddcd" stroke-width="11"/><path d="M128 0 152 55 148 112 177 184 162 252 192 310 M174 0 223 52 277 82 338 134 374 207 406 310 M305 0 307 53 354 113 460 153 550 194 643 239 740 256 M137 220 258 202 330 220 456 248 585 270 740 294 M438 0 410 52 405 102 429 182 425 310 M141 107 260 118 374 90 500 95 627 67 740 89" fill="none" stroke="#fffef7" stroke-width="7"/><path d="M255 40 278 82 338 134 363 187 396 239 453 250 497 266" fill="none" stroke="#398464" stroke-width="3"/><path d="M255 40 226 67 260 118 267 165 259 202 332 220 373 280" fill="none" stroke="#71a486" stroke-width="3" stroke-dasharray="7 4"/><path d="M255 40 308 53 353 113 405 102 467 102" fill="none" stroke="#c69743" stroke-width="3" stroke-dasharray="6 4"/><g fill="white" stroke="#398464" stroke-width="2"><circle cx="338" cy="134" r="5"/><circle cx="396" cy="239" r="5"/><circle cx="497" cy="266" r="5"/><circle cx="259" cy="202" r="5"/><circle cx="373" cy="280" r="5"/></g><rect x="246" y="30" width="18" height="18" rx="4" fill="#146b45" stroke="white" stroke-width="3"/><text x="273" y="36" class="map-place">PELIYAGODA DEPOT</text><text x="166" y="146" class="map-place">COLOMBO</text><text x="420" y="82" class="map-label">Kelaniya</text><text x="469" y="153" class="map-label">Rajagiriya</text><text x="287" y="190" class="map-label">Borella</text><text x="425" y="234" class="map-label">Nugegoda</text><text x="538" y="286" class="map-label">Maharagama</text><text x="173" y="277" class="map-label">Dehiwala</text><text x="45" y="169" fill="#8da8a7" font-size="10" transform="rotate(-90 45 169)" letter-spacing="3">INDIAN OCEAN</text></svg><div class="map-controls"><button class="selected" data-action="map-all">${icon('route')}Routes</button><button data-view="outlets">Outlets</button></div>${visibleTrips().filter(t=>t.depot==='Peliyagoda').map(t=>{const i=trips.indexOf(t);return `<button class="map-pin ${t.risk?'amber':''} ${selectedTrip===i?'selected':''}" style="left:${[47,58,32,38][i]}%;top:${[48,75,35,23][i]}%" data-trip="${i}" aria-label="View ${t.id}">${icon('truck')}</button>`}).join('')}<div class="map-callout"><strong>${trips[selectedTrip].id} · ${trips[selectedTrip].status}</strong><span class="muted">Next: ${trips[selectedTrip].next.split(' · ')[1]} · ${trips[selectedTrip].eta}</span></div><div class="map-caption">Illustrative route map · not for navigation</div></div><div class="map-footer"><div class="legend"><span><i class="dot"></i>On schedule</span><span><i class="dot amber"></i>At risk</span><span><i class="dot gray"></i>At depot</span></div><span>Last updated 07:24 AM</span></div></section>`}
function exceptionList(){return exceptions.length?exceptions.map((e,i)=>`<div class="exception"><div class="exception-icon ${i===0?'red':''}">${icon(e.type==='offline'?'refresh':'alert')}</div><div class="exception-content"><h3>${escapeHTML(e.title)}</h3><p>${escapeHTML(e.detail)}</p><div class="exception-bottom"><span>${e.owner} · ${e.time}</span><button class="text-button" data-exception="${i}">Resolve →</button></div></div></div>`).join(''):`<div class="empty"><img src="${A}web/delivery-complete.png" alt=""><h3>All caught up</h3>No open exceptions.</div>`}
function visibleTrips(){return trips.filter(t=>(depot==='All depots'||t.depot===depot)&&(!search||[t.id,t.next,t.driver,t.depot].join(' ').toLowerCase().includes(search.toLowerCase()))&&(filter==='All trips'||filter==='At risk'&&t.risk||filter==='Refrigerated'&&t.cold||filter==='Fresh before 8 AM'&&t.cold||filter==='On route'&&t.status==='On route')).sort((a,b)=>sortReverse?b.id.localeCompare(a.id):0)}
function tripRows(){const rows=visibleTrips();return rows.length?rows.map(t=>`<tr tabindex="0" role="button" data-trip="${trips.indexOf(t)}" aria-label="Open ${t.id}"><td><div class="vehicle-cell"><span class="vehicle-icon">${icon('truck')}</span><div><strong>${t.id}</strong><small>Trip 1 · ${t.driver}</small></div></div></td><td>${t.depot}</td><td>${t.done} of ${t.stops} stops<div class="progress"><span style="width:${t.done/t.stops*100}%"></span></div></td><td><strong>${t.next}</strong><small>ETA ${t.eta}</small></td><td>${t.w} / ${t.cap} t<small>${t.v} / ${t.vcap} m³</small></td><td>${t.cold?badge('❄ Refrigerated'):badge('Ambient','gray')}</td><td>${t.risk?badge('△ At risk','amber'):badge('✓ On schedule')}</td><td>${badge(t.status,t.status==='On route'?'blue':t.status==='Loading issue'?'red':'gray')}</td><td>${icon('chevron')}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">No trips match these filters. Try another depot or clear your search.</td></tr>'}
function tripsTable(){return `<section class="panel"><div class="panel-head"><div class="row"><h2>Today’s trips</h2><span class="badge gray">${visibleTrips().length} trips</span></div><button class="small" data-action="export">${icon('download')} Export</button></div><div class="toolbar"><div class="filters">${['All trips','Fresh before 8 AM','Refrigerated','At risk'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f==='Refrigerated'?'❄ ':''}${f}</button>`).join('')}</div><button class="ghost small muted" data-action="sort">Sort by vehicle ${sortReverse?'↓':'↑'}</button></div><div class="table-wrap"><table><thead><tr>${['Vehicle / trip','Depot','Route progress','Next stop','Capacity','Handling','ETA forecast','Status',''].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${tripRows()}</tbody></table></div><div class="table-footer"><span>Showing ${visibleTrips().length} of ${trips.length} sample trips</span><span>Fresh routes are prioritized before 8:00 AM</span></div></section>`}
function operations(){return header('Today’s operations','Every delivery connected. Here’s how your day is moving.',`<button class="primary" data-view="planning">${icon('route')} Open plan builder ${icon('arrow')}</button>`)+metrics()+`<div class="dashboard-grid">${routeMap()}<section class="panel exceptions"><div class="panel-head"><div class="row"><h2>Needs your attention</h2>${badge(exceptions.length,'amber')}</div>${icon('alert')}</div>${exceptionList()}<div class="queue-footer"><button class="text-button" data-action="notifications">View all exceptions ${icon('arrow')}</button></div></section></div>`+tripsTable()}
function planning(){const w=assigned.reduce((a,o)=>a+o.weight,1.8),v=assigned.reduce((a,o)=>a+o.volume,9);return header('Build a deliverable plan','Tuesday, 21 April · Peliyagoda depot · Changes stay in this demo session.',`<div class="row"><button data-action="save-plan">Save draft</button><button class="primary" data-action="publish">${icon('check')} ${published?'Plan published':'Publish plan'}</button></div>`)+`<div class="three-col"><section class="panel"><div class="panel-head"><h2>Unassigned orders</h2>${badge(orders.length,'amber')}</div><div class="pad stack"><button data-action="suggest">${icon('route')} Auto-suggest assignments</button>${orders.map(o=>`<article class="order-card"><div class="spread"><h3>${o.outlet}</h3>${badge(o.cold?'Chilled':'Ambient',o.cold?'':'gray')}</div><div class="tiny muted">${o.id} · 06:00–08:00 AM</div><p>${o.weight} t · ${o.volume} m³ · Priority: standard</p><div class="spread"><button class="small" data-assign="${o.id}">Assign to trip</button><button class="text-button" data-defer="${o.id}">Review deferral</button></div></article>`).join('')||`<div class="empty"><img src="${A}web/no-orders-yet.png" alt=""><h3>Order queue cleared</h3>${deferred.length} deferred · ${assigned.length} assigned</div>`}</div></section><section class="panel"><div class="panel-head"><div><h2>WP–024 · Trip 1</h2><p>Peliyagoda → Colombo East</p></div>${badge(published?'Published':'Draft',published?'':'gray')}</div><div class="pad"><div class="callout green" style="margin-bottom:24px">✓ Refrigerated route · 2–4°C<br>Assignments checked against weight and volume limits.</div><div class="route-stop"><h3>Peliyagoda depot</h3><p>Departure · 06:20 AM</p></div><div class="route-stop"><h3>01 · Fresh, Borella</h3><p>06:50 AM arrival · 15 min service</p></div>${assigned.map((o,i)=>`<div class="route-stop"><div class="spread"><h3>0${i+2} · ${o.outlet}</h3><button class="ghost small" data-remove="${o.id}" aria-label="Remove ${o.id}">×</button></div><p>07:${String(10+i*15).padStart(2,'0')} AM arrival · ${o.weight} t · ${o.volume} m³</p></div>`).join('')}<div class="route-stop"><h3>Return to depot</h3><p>Estimated 08:30 AM</p></div><p class="tiny muted">Estimated arrivals are illustrative and require dispatcher review.</p></div></section><section class="panel"><div class="panel-head"><h2>Vehicle inspector</h2>${icon('truck')}</div><div class="pad"><h3>WP–024 · Refrigerated truck</h3><p class="muted tiny">Available · Trip 1 of 2 · Driver: Chamara</p>${badge('❄ Chilled goods eligible')}<div class="capacity"><p><span>Weight</span><strong>${w.toFixed(2)} / 3.5 t</strong></p><div class="progress"><span style="width:${w/3.5*100}%"></span></div></div><div class="capacity"><p><span>Volume</span><strong>${v.toFixed(1)} / 18 m³</strong></p><div class="progress"><span style="width:${v/18*100}%"></span></div></div><div class="summary-line"><span>Fuel quota remaining</span><strong>82 L</strong></div><div class="summary-line"><span>Estimated route duration</span><strong>2 h 10 min</strong></div><p class="tiny">✓ Depot compatible<br><br>✓ Within daily trip limit<br><br>✓ No van-only outlets assigned</p><div class="callout">${orders.length} orders need a decision.<br>${deferred.length} orders deferred with a recorded reason.</div><img class="illustration" src="${A}web/planning-intelligence.png" alt="Route planning illustration"></div></section></div>`}
function loading(){return header('Load board','Peliyagoda · Morning shift · Load safely, hand over with confidence.',badge(shortfall?'1 vehicle blocked':(trips[3].status==='Ready to depart'?'2 vehicles loading · 2 ready':'3 vehicles loading · 1 ready'),shortfall?'red':'gray'))+`<div class="board">${[['Scheduled','WP–029','5 stops · Depart 08:30'],['Loading','WP–027','4 stops · Depart 07:50'],[shortfall?'Loading issue':trips[3].status,'WP–016','3 stops · Depart 07:40'],['Ready to depart','WP–021','6 stops · Checks complete']].map((l,i)=>`<div class="lane"><h3>${l[0]}</h3><div class="order-card"><div class="spread"><h3>${l[1]}</h3>${icon('truck')}</div><p>${l[2]}</p>${badge(i===3?'✓ Checked':'❄ Refrigerated',i===3?'':'gray')}</div></div>`).join('')}</div><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>WP–016 · Loading manifest</h2><p>Trip 1 · Fresh · Peliyagoda</p></div><button class="small" data-action="shortfall">${icon('alert')} Report shortfall</button></div><div class="pad"><div class="callout green">Load Stop 3 first → Stop 1 last. Deliver in the opposite sequence.</div>${['03 · Fresh, Ja-Ela','02 · Fresh, Kandana','01 · Fresh, Wattala'].map((s,i)=>`<label class="check"><input type="checkbox" data-load="${i}" ${loadChecked[i]?'checked':''}><span><strong>${s}</strong><br><span class="muted tiny">${[18,12,24][i]} crates · Chilled 2–4°C · ${loadChecked[i]?'Checked by Sanath · 07:24 AM':'Awaiting manual check'}</span></span></label>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Pre-departure checks</h2>${icon('shield')}</div><div class="pad">${['Vehicle clean · Temperature 2–4°C','Item counts match the manifest','No damaged goods','Load secured and final seal checked'].map((c,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checks[i]?'checked':''}>${c}</label>`).join('')}<p class="muted tiny">All goods and checks must be confirmed before release.</p>${shortfall?'<div class="callout">Loading shortfall unresolved. Dispatcher approval required before departure.</div>':''}<button class="primary full" data-action="ready" ${!checks.every(Boolean)||!loadChecked.every(Boolean)||shortfall?'disabled':''}>${icon('check')}Ready to depart</button></div></section></div>`}
function composer(){return header('Create a store order','Fresh · Nugegoda · Outlet F–042',`<button data-view="tracking">${icon('clock')}Order history</button>`)+`<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Fresh catalogue</h2><p>Order by 04:00 PM for tomorrow’s planning</p></div>${badge('4 products','gray')}</div><div class="table-wrap"><table><thead><tr><th>Product / SKU</th><th>Handling</th><th>Quantity</th></tr></thead><tbody>${products.map((p,i)=>`<tr><td><strong>${p.name}</strong><small>${p.sku} · ${p.pack}</small><small>Available to order</small></td><td>${badge(p.type,i===3?'gray':'')}</td><td><div class="quantity"><button data-qty="${i}" data-delta="-1" aria-label="Decrease ${p.name}">−</button><input type="number" min="0" max="99" value="${quantities[i]}" data-quantity="${i}" aria-label="Quantity for ${p.name}"><button data-qty="${i}" data-delta="1" aria-label="Increase ${p.name}">+</button></div></td></tr>`).join('')}</tbody></table></div><div class="pad"><div class="callout green">Your delivery requirements travel with your order. Chilled and frozen goods will be allocated to compatible vehicles.</div></div></section><section class="panel"><div class="panel-head"><h2>Order summary</h2>${icon('box')}</div><form class="pad" id="order-form"><label class="field">Requested delivery date<input type="date" name="date" min="2026-04-22" value="2026-04-22" required></label><label class="field">Preferred delivery window<select name="window"><option>06:00–08:00 AM</option><option>08:00–10:00 AM</option></select></label><label class="field">PO / reference<input name="reference" placeholder="e.g. NUG-APR-042" maxlength="60"></label><div id="order-totals">${totals()}</div><p class="tiny muted">Submission requests a delivery. The planning team confirms your route and ETA.</p><div class="row"><button type="button" data-action="save-order">Save draft</button><button class="primary" type="submit">Review order ${icon('arrow')}</button></div></form></section></div>`}
function totals(){return `<div class="summary-line"><span>Total packs</span><strong>${quantities.reduce((a,b)=>a+b,0)}</strong></div><div class="summary-line"><span>Estimated weight</span><strong>${quantities.reduce((a,q,i)=>a+q*products[i].weight,0)} kg</strong></div><div class="summary-line"><span>Estimated volume</span><strong>${quantities.reduce((a,q,i)=>a+q*products[i].volume,0).toFixed(2)} m³</strong></div>`}
function tracking(){return header('Order tracking & receipt','Fresh · Nugegoda · ORD–2036 · Requested 21 April 2026',`<button data-action="contact">${icon('help')}Contact operations</button>`)+`<section class="panel timeline">${['Submitted','Planned','Loading','On route','Delivered','Receipt confirmed'].map((s,i)=>`<div class="timeline-step ${i<5||receipt?'done':''}">${s}<small>${['20 Apr · 02:40 PM','20 Apr · 05:15 PM','06:20 AM','06:45 AM','07:20 AM',receipt?'07:24 AM':'Awaiting you'][i]}</small></div>`).join('')}</section><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Delivery received at 07:20 AM</h2><p>WP–012 · Trip 1 · Unloaded at receiving bay</p></div>${badge(receipt?'✓ Receipt confirmed':'Review delivery',receipt?'':'amber')}</div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Ordered</th><th>Delivered</th><th>Accepted</th></tr></thead><tbody>${products.slice(0,3).map((p,i)=>`<tr><td><strong>${p.name}</strong><small>${p.pack}</small></td><td>${[4,6,2][i]}</td><td>${[4,6,2][i]}</td><td>${receipt?[4,6,2][i]:'Pending'}</td></tr>`).join('')}</tbody></table></div><div class="pad"><div class="callout green">Please check quantities and condition before confirming. Any issue remains linked to the original delivery.</div><div class="row" style="margin-top:20px"><button class="primary" data-action="receipt" ${receipt?'disabled':''}>${icon('check')}${receipt?'Receipt confirmed':'Confirm receipt'}</button><button data-action="receipt-issue">Report issue</button></div></div></section><section class="panel"><div class="panel-head"><h2>Order activity</h2>${icon('clock')}</div><div class="pad">${receipt?'<div class="activity">Receipt confirmed by store manager<small>21 Apr · 07:24 AM</small></div>':''}<div class="activity">Delivery recorded by Nimal Perera<small>21 Apr · 07:20 AM · Proof of delivery saved</small></div><div class="activity">Vehicle departed Peliyagoda<small>21 Apr · 06:45 AM</small></div><div class="activity">Manifest checked by Sanath<small>21 Apr · 06:35 AM</small></div><div class="activity">Route published by Anjali Perera<small>20 Apr · 05:15 PM</small></div>${submitted?'<div class="activity">New order ORD–2051 submitted<small>Awaiting plan · Requested 22 Apr</small></div>':''}<img class="illustration" src="${A}web/delivery-complete.png" alt="Completed delivery illustration"></div></section></div>`}
function directory(){if(view==='fleet')return header('Fleet directory','Vehicle capability and operational availability.',`<button data-action="export">${icon('download')}Export fleet</button>`)+tripsTable();return header('Outlet directory','Delivery windows and handling requirements for today’s sample outlets.')+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Outlet</th><th>Brand</th><th>Delivery window</th><th>Requirement</th><th>Status</th></tr></thead><tbody>${trips.filter(t=>(depot==='All depots'||t.depot===depot)&&t.next.toLowerCase().includes(search.toLowerCase())).map(t=>`<tr data-trip="${trips.indexOf(t)}" tabindex="0" role="button"><td><strong>${t.next.split(' · ')[1]}</strong><small>${t.depot} service area</small></td><td>Waypoint ${t.next.split(' · ')[0]}</td><td>${t.cold?'06:00–08:00 AM':'08:00–12:00 PM'}</td><td>${t.cold?'Refrigerated · 2–4°C':'Ambient'}</td><td>${badge(t.status,'gray')}</td></tr>`).join('')}</tbody></table></div></section>`}
function reports(){return header('Daily operations report','Sample operating day · Tuesday, 21 April 2026',`<button data-action="export">${icon('download')}Download trip CSV</button>`)+metrics()+`<div class="two-col"><section class="panel"><div class="panel-head"><h2>Delivery progress by brand</h2>${icon('chart')}</div><div class="pad">${[['Fresh',68,80],['Style',25,28],['Tech',15,18]].map(x=>`<div class="capacity"><p><strong>Waypoint ${x[0]}</strong><span>${x[1]} / ${x[2]} orders planned</span></p><div class="progress"><span style="width:${x[1]/x[2]*100}%"></span></div></div>`).join('')}<p class="tiny muted">Illustrative totals. Trip CSV exports the four detailed sample records.</p></div></section><section class="panel"><div class="panel-head"><h2>Handoff summary</h2></div><div class="pad"><div class="summary-line"><span>Open exceptions</span><strong>${exceptions.length}</strong></div><div class="summary-line"><span>Deferred in this session</span><strong>${deferred.length}</strong></div><div class="summary-line"><span>Receipt confirmation</span><strong>${receipt?'Complete':'Pending'}</strong></div><img class="illustration" src="${A}web/connected-handoff-chain.png" alt="Connected order, loading, delivery and receipt chain"></div></section></div>`}
function auth(){const reset=authMode==='reset',activate=authMode==='activate';return `<div class="auth"><section class="auth-side"><div class="brand"><img src="${A}brand/waypoint-flow-mark.svg" alt="">Waypoint Flow</div><h1>Connected delivery operations.</h1><p class="muted">From the first order to the final handoff.<br>Your team, working in one flow.</p><img class="hero" src="${A}web/auth-route-motif.png" alt="Connected depot and outlet routes"></section><section class="auth-form"><form id="auth-form"><span class="demo-label">Interactive frontend demo</span><h1>${reset?'Reset your password':activate?'Activate your account':'Welcome back'}</h1><p>${reset?'Enter your work email to request reset instructions.':activate?'Accounts are created by your Waypoint administrator.':'Sign in to your Waypoint workspace.'}</p>${activate?'<div class="callout">A valid administrator invitation is required. Request an invitation from your operations administrator.</div>':`<label class="field">Work email<input type="email" name="email" required placeholder="you@waypoint.lk" autocomplete="username"></label>${!reset?'<label class="field">Password<div class="row"><input id="password" type="password" name="password" required minlength="8" placeholder="Enter your password" autocomplete="current-password"><button type="button" data-action="password">Show</button></div></label><label class="check" style="border:0;margin-bottom:20px"><input type="checkbox">Keep me signed in on this trusted device</label>':''}<button class="primary full" type="submit">${reset?'Send reset link':'Enter demo workspace'}</button>`}<div class="auth-links"><button class="text-button" type="button" data-auth="${reset||activate?'signin':'reset'}">${reset||activate?'Back to sign in':'Forgot password?'}</button><button class="text-button" type="button" data-auth="activate">Activate your account</button></div><p class="tiny">This prototype does not authenticate users or send email. Use sample credentials only.</p><button class="ghost full" type="button" data-view="operations">Explore demo ${icon('arrow')}</button></form></section></div>`}
function render(){document.getElementById('root').innerHTML=view==='auth'?auth():shell();if(view!=='auth')document.getElementById('depot').value=depot;if(view==='orders'&&orderDraft){const form=document.getElementById('order-form');form.elements.date.value=orderDraft.date||'2026-04-22';form.elements.reference.value=orderDraft.reference||'';}document.title=`Waypoint Flow · ${view[0].toUpperCase()+view.slice(1)}`;}
function go(v){closeDrawer();view=v;render();window.scrollTo(0,0)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4200)}
function drawer(title,body){drawerFocus=document.activeElement;document.getElementById('overlay-root').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title">${title}</h2><button class="ghost small" data-action="close" aria-label="Close panel">${icon('close')}</button></div>${body}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.drawer button, .drawer input')?.focus()}
function closeDrawer(){document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';if(drawerFocus?.isConnected)drawerFocus.focus()}
function tripDetail(i){selectedTrip=i;render();const t=trips[i];drawer(`${t.id} · Trip 1`,`${badge(t.status,t.risk?'amber':'blue')}<p>${t.depot} depot · ${t.driver}</p><div class="summary-line"><span>Next stop</span><strong>${t.next}</strong></div><div class="summary-line"><span>Estimated arrival</span><strong>${t.eta}</strong></div><div class="summary-line"><span>Capacity</span><strong>${t.w} / ${t.cap} t · ${t.v} / ${t.vcap} m³</strong></div><div class="summary-line"><span>Handling</span><strong>${t.cold?'Refrigerated · 2–4°C':'Ambient'}</strong></div><h3 style="margin-top:25px">Activity history</h3><div class="activity">${t.done?'Delivery progress updated':'Loading manifest opened'}<small>07:20 AM · ${t.driver}</small></div><div class="activity">Route published<small>05:45 AM · Anjali Perera</small></div>${t.risk?'<div class="callout" style="margin-top:20px">Attention required. Review the exception before releasing or revising this trip.</div>':''}<button class="primary full" data-view="${t.status.includes('Loading')?'loading':'planning'}">Open ${t.status.includes('Loading')?'load board':'plan builder'} ${icon('arrow')}</button>`)}
function resolveException(i){const e=exceptions[i];drawer(e.title,`<p>${e.detail}</p>${badge(e.owner,'gray')}<div class="callout" style="margin-top:20px">${e.type==='shortfall'?'Eight crates are missing. A replacement must be confirmed before the original manifest can depart.':e.type==='eta'?'Traffic may breach the store’s delivery window by 15 minutes. Review and record the revised ETA.':'Driver updates have not synced. Confirm contact before closing this exception.'}</div><form id="resolve-form" data-index="${i}"><label class="field" style="margin-top:20px">Resolution<select name="resolution">${(e.type==='shortfall'?['Replacement confirmed at dock','Keep vehicle on hold']:e.type==='eta'?['Revised ETA acknowledged by store','Keep monitoring']:['Contact confirmed; driver safe','Keep monitoring']).map(s=>`<option>${s}</option>`).join('')}</select></label><label class="field">Resolution note<textarea name="note" required placeholder="Record the action taken and who confirmed it"></textarea></label><p>Demo action: saves the decision in this session. No external message is sent.</p><button class="primary full">Record resolution</button></form>`)}
function deferral(id){const o=orders.find(o=>o.id===id);drawer('Review order deferral',`<h3>${o.outlet}</h3><p>${o.id} · ${o.weight} t · ${o.volume} m³ · Requested 21 April</p><img class="illustration" src="${A}web/capacity-constraint.png" alt="Capacity constraint illustration"><div class="callout">Store impact: this order will leave today’s planning queue. The proposed date must be reviewed with the store.</div><form id="defer-form" data-id="${id}"><label class="field" style="margin-top:20px">Reason<select name="reason" required><option value="">Select a reason</option><option>No compatible refrigerated capacity</option><option>Vehicle capacity</option><option>Window conflict</option><option>Access constraint</option><option>Operational disruption</option><option>Other</option></select></label><label class="field">Alternatives considered and decision note<textarea name="note" required></textarea></label><label class="field">Proposed service date<input type="date" name="date" min="2026-04-22" value="2026-04-22" required></label><p>Demo notification preview: Your order is deferred. The reason, note, and proposed date will appear in the session record.</p><button class="danger full">Confirm deferral · Demo</button><button type="button" class="ghost full" data-action="close">Keep unassigned</button></form>`)}
function assign(id,silent=false){if(published){toast('The plan is published. Start a new planning session to change it.');return false}const o=orders.find(o=>o.id===id);if(!o)return false;const weight=1.8+assigned.reduce((a,b)=>a+b.weight,0)+o.weight,vol=9+assigned.reduce((a,b)=>a+b.volume,0)+o.volume;if(weight>3.5||vol>18){toast('Assignment blocked: vehicle weight or volume capacity exceeded.');return false}assigned.push(o);orders=orders.filter(x=>x.id!==id);if(!silent){render();toast('Order assigned. Capacity and arrival estimates updated.')}return true}
function exportCSV(){const csv=[['Vehicle','Depot','Status','Next stop','ETA','Weight (t)','Volume (m3)'],...visibleTrips().map(t=>[t.id,t.depot,t.status,t.next,t.eta,t.w,t.v])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='waypoint-trips-2026-04-21.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Trip report exported.')}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-trip]');if(e.target.classList.contains('overlay'))closeDrawer();if(!b)return;if(b.dataset.view)return go(b.dataset.view);if(b.dataset.auth){authMode=b.dataset.auth;return render()}if(b.dataset.trip!==undefined)return tripDetail(+b.dataset.trip);if(b.dataset.exception!==undefined)return resolveException(+b.dataset.exception);if(b.dataset.filter){filter=b.dataset.filter;return render()}if(b.dataset.metric){if(b.dataset.metric==='exceptions'){drawer('Open exceptions',exceptionList());return}filter=b.dataset.metric;view='operations';render();return document.querySelector('table')?.scrollIntoView({behavior:'smooth',block:'center'})}if(b.dataset.assign)return assign(b.dataset.assign);if(b.dataset.defer)return deferral(b.dataset.defer);if(b.dataset.remove){if(published)return toast('Published routes are locked in this demo.');const o=assigned.find(o=>o.id===b.dataset.remove);return drawer('Remove from route',`<p>${o.outlet} will return to the unassigned queue. Its planned arrival will be removed.</p><form id="remove-form" data-id="${o.id}"><label class="field">Reason<textarea name="reason" required></textarea></label><button class="danger full">Confirm removal</button></form>`)}if(b.dataset.qty!==undefined){const i=+b.dataset.qty;quantities[i]=Math.max(0,Math.min(99,quantities[i]+ +b.dataset.delta));document.querySelector(`[data-quantity="${i}"]`).value=quantities[i];document.getElementById('order-totals').innerHTML=totals();return}
const action=b.dataset.action;if(action==='close')closeDrawer();if(action==='menu')document.getElementById('sidebar').classList.toggle('open');if(action==='notifications')drawer('Open exceptions',exceptionList());if(action==='sort'){sortReverse=!sortReverse;render()}if(action==='export')exportCSV();if(action==='map-all'){filter='All trips';search='';render()}if(action==='help'||action==='contact')drawer('Operations support',`<h3>Keep the handoff connected</h3><p>For delivery or loading issues, use the exception actions to record the affected order and the next owner.</p><div class="callout green">This is an offline frontend prototype. Data changes last for this session; email, authentication, and live tracking require a backend.</div><button class="primary full" data-view="operations">Open operations</button>`);if(action==='save-plan')toast('Draft kept in this session.');if(action==='suggest'){[...orders].forEach(o=>assign(o.id,true));render();toast('Suggested orders assigned. Review the route before publishing.')}if(action==='publish'){if(published)return toast('This plan has already been published.');drawer('Publish delivery plan',`<h3>WP–024 · Peliyagoda · Trip 1</h3><p>${assigned.length+1} stops · 1 refrigerated vehicle released to the load board.</p><div class="callout">${orders.length} orders remain unassigned. ${deferred.length} orders are deferred.<br>Publishing is blocked until every order has a decision.</div><p>Review the manifest and route estimates. Driver and store notifications are simulated in this prototype.</p><button class="primary full" data-action="confirm-publish" ${orders.length?'disabled':''}>Confirm and publish · Demo</button>`)}if(action==='confirm-publish'){published=true;closeDrawer();render();toast('Plan published in this session.')}if(action==='shortfall')drawer('Report loading shortfall',`<h3>WP–016 · Stop 1 · Fresh, Wattala</h3><p>Mixed vegetables · Expected 24 crates · Departure 07:40 AM</p><form id="shortfall-form"><label class="field">Issue type<select name="type"><option>Missing</option><option>Damaged</option><option>Temperature concern</option><option>Other</option></select></label><label class="field">Quantity affected<input name="qty" type="number" min="1" max="24" value="8" required></label><label class="field">Note<textarea name="note" required placeholder="What did you find?"></textarea></label><div class="callout">Departure will be blocked until the dispatcher confirms a resolution. The store is not notified at this stage.</div><button class="primary full">Escalate to dispatcher</button></form>`);if(action==='ready'){if(shortfall||!checks.every(Boolean)||!loadChecked.every(Boolean))return;trips[3].status='Ready to depart';trips[3].risk=false;render();toast('WP–016 is ready to depart. Driver handoff recorded.')}if(action==='save-order'){try{localStorage.setItem('waypoint-order-draft',JSON.stringify({quantities,date:document.querySelector('[name=date]').value,reference:document.querySelector('[name=reference]').value}));toast('Order draft saved on this device.')}catch{toast('Local storage unavailable; draft remains in this session.')}}if(action==='receipt'){drawer('Confirm delivery receipt',`<p>Confirm that all delivered items match the quantities and are in acceptable condition.</p><div class="callout green">12 packs · Fresh, Nugegoda · ORD–2036</div><button class="primary full" data-action="confirm-receipt">Confirm all items received</button>`)}if(action==='confirm-receipt'){receipt=true;closeDrawer();render();toast('Receipt confirmed · Store manager · 07:24 AM')}if(action==='receipt-issue')drawer('Report a delivery issue',`<form id="issue-form"><label class="field">Affected item<select name="item">${products.slice(0,3).map(p=>`<option>${p.name}</option>`).join('')}</select></label><label class="field">Issue<select name="type"><option>Wrong quantity</option><option>Damage</option><option>Missing goods</option><option>Temperature concern</option><option>Other</option></select></label><label class="field">Details<textarea name="note" required></textarea></label><p>The original delivery record is preserved. This creates an exception for operations.</p><button class="primary full">Submit issue</button></form>`);if(action==='password'){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show':'Hide'}});
document.addEventListener('change',e=>{if(e.target.id==='depot'){depot=e.target.value;render()}if(e.target.dataset.check!==undefined){checks[+e.target.dataset.check]=e.target.checked;render()}if(e.target.dataset.load!==undefined){loadChecked[+e.target.dataset.load]=e.target.checked;render()}if(e.target.dataset.quantity!==undefined){let i=+e.target.dataset.quantity;quantities[i]=Math.max(0,Math.min(99,Math.floor(Number(e.target.value)||0)));e.target.value=quantities[i];document.getElementById('order-totals').innerHTML=totals()}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){search=e.target.value;if(!['operations','outlets','fleet'].includes(view))view='operations';document.getElementById('main').innerHTML=content();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='auth-form'){if(authMode==='reset')toast('Demo: reset request preview. No email has been sent.');else go('operations')}if(f.id==='resolve-form'){audit.push({action:'Exception resolution',note:d.get('note'),decision:d.get('resolution')});const i=+f.dataset.index;if(d.get('resolution').startsWith('Keep')){closeDrawer();return toast('Exception remains open for monitoring.')}if(exceptions[i].type==='shortfall'){shortfall=false;trips[3].status='Loading';trips[3].risk=false}exceptions.splice(i,1);closeDrawer();render();toast('Resolution recorded by Anjali Perera.')}if(f.id==='defer-form'){const o=orders.find(o=>o.id===f.dataset.id);deferred.push({...o,reason:d.get('reason'),note:d.get('note'),date:d.get('date')});orders=orders.filter(x=>x.id!==o.id);closeDrawer();render();toast('Order deferred. Reason and revised date recorded in this session.')}if(f.id==='remove-form'){audit.push({action:'Order removed from route',note:d.get('reason')});const o=assigned.find(o=>o.id===f.dataset.id);orders.push(o);assigned=assigned.filter(x=>x.id!==o.id);closeDrawer();render();toast('Order returned to planning. Removal reason recorded.')}if(f.id==='shortfall-form'){audit.push({action:'Loading shortfall',note:d.get('note')});shortfall=true;trips[3].status='Loading issue';if(!exceptions.some(e=>e.type==='shortfall'))exceptions.unshift({title:'Loading shortfall',detail:`WP–016 · ${d.get('qty')} crates · ${d.get('type')}`,owner:'Warehouse · Sanath',time:'Just now',type:'shortfall'});closeDrawer();render();toast('Shortfall escalated. Vehicle departure blocked.')}if(f.id==='order-form'){orderDraft={date:d.get('date'),window:d.get('window'),reference:d.get('reference'),quantities:[...quantities]};if(!quantities.some(Boolean))return toast('Add at least one product before reviewing.');drawer('Review your order',`<h3>Fresh · Nugegoda</h3><p>Requested ${escapeHTML(d.get('date'))} · ${escapeHTML(d.get('window'))}</p>${products.map((p,i)=>quantities[i]?`<div class="summary-line"><span>${p.name}</span><strong>${quantities[i]} packs</strong></div>`:'').join('')}<p>PO: ${escapeHTML(d.get('reference')||'Not supplied')}</p><div class="callout">This request is subject to fleet planning. An exact ETA is available once the route is published.</div><form id="submit-order"><button class="primary full">Submit order · Demo</button></form>`)}if(f.id==='submit-order'){submitted=true;closeDrawer();toast('ORD–2051 submitted — awaiting plan.');go('tracking')}if(f.id==='issue-form'){audit.push({action:'Receipt issue',note:d.get('note')});exceptions.unshift({title:'Store receipt issue',detail:`ORD–2036 · ${d.get('item')} · ${d.get('type')}`,owner:'Store · Nugegoda',time:'Just now',type:'receipt'});closeDrawer();toast('Issue added to the operations exception queue.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('global-search')?.focus()}if(e.key==='Enter'&&e.target.matches('tr[data-trip]'))tripDetail(+e.target.dataset.trip);if(e.key==='Tab'&&document.querySelector('.drawer')){const nodes=[...document.querySelectorAll('.drawer button:not(:disabled),.drawer input,.drawer select,.drawer textarea')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
try{const draft=JSON.parse(localStorage.getItem('waypoint-order-draft'));if(draft?.quantities?.length===4){orderDraft=draft;quantities=draft.quantities.map(q=>Math.max(0,Math.min(99,Number(q)||0)))}}catch{}
const baseRender=render;
render=function(){
  baseRender();
  const main=document.getElementById('main');
  if(view==='tracking'&&submitted&&orderDraft){
    const card=document.createElement('section');card.className='panel pad';card.style.marginBottom='20px';
    card.innerHTML=`<div class="spread"><h2>ORD–2051 · New order</h2>${badge('Submitted — awaiting plan','blue')}</div><p>Requested ${escapeHTML(orderDraft.date)} · ${escapeHTML(orderDraft.window||'06:00–08:00 AM')} · ${orderDraft.quantities.reduce((a,b)=>a+b,0)} packs</p><p class="tiny muted">Your request is recorded. A confirmed ETA will appear after planning.</p>`;
    main.querySelector('.page-header').after(card);
  }
  if((view==='planning'||view==='tracking')&&deferred.length){
    const card=document.createElement('section');card.className='panel pad';card.style.marginTop='20px';
    card.innerHTML=`<h2>Deferred orders</h2>${deferred.map(o=>`<div class="activity"><div class="spread"><strong>${o.id} · ${o.outlet}</strong>${badge('Deferred','amber')}</div><p>${escapeHTML(o.reason)} · Proposed ${escapeHTML(o.date)}</p><p>${escapeHTML(o.note)}</p><small>Recorded by Anjali Perera · This session</small>${view==='planning'&&!published?`<button class="small" style="margin-top:12px" data-restore="${o.id}">Restore to planning</button>`:''}</div>`).join('')}`;
    main.querySelector('.page-footer').before(card);
  }
  if(view==='loading'&&published){
    const card=document.createElement('div');card.className='callout green';card.style.marginBottom='20px';card.textContent=`Published plan received: WP–024 · Trip 1 · ${assigned.length+1} stops · Scheduled for loading.`;
    main.querySelector('.page-header').after(card);
  }
  if(view==='reports'&&audit.length){
    const card=document.createElement('section');card.className='panel pad';card.style.marginTop='20px';
    card.innerHTML=`<h2>Session decision history</h2>${audit.map(a=>`<div class="activity"><strong>${escapeHTML(a.action)}</strong><p>${escapeHTML(a.note||'')}${a.decision?' · '+escapeHTML(a.decision):''}</p><small>Recorded in this demo session</small></div>`).join('')}`;
    main.querySelector('.page-footer').before(card);
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-restore]');if(!b)return;const o=deferred.find(o=>o.id===b.dataset.restore);if(o&&!published){orders.push(o);deferred=deferred.filter(x=>x.id!==o.id);audit.push({action:'Restored to planning',note:o.id});render();toast('Order restored to the planning queue.')}});
render();
</script>
</body>
</html>
