function notify(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.hidden=true,4500)}
function record(type,title,details={}){const r={id:Date.now(),type,title,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),synced:false,...details};state.records.unshift(r);if(!persist()){state.records.shift();notify('Storage is full or unavailable. Record not saved; reduce photo size and retry.');return false}return true}
function heading(title,sub,tag='Tuesday, 21 April'){return `<div class="heading"><div class="eyebrow">${tag}</div><h1>${title}</h1>${sub?`<p class="small muted">${sub}</p>`:''}</div>`}
function back(title,to){return `<div class="back-heading"><button class="ghost icon-button" data-page="${to}" aria-label="Back">${icon('back')}</button><h1>${title}</h1></div>`}
function art(name,alt='',cls='state-art'){return `<img class="${cls}" src="${ASSET}mobile/${name}.png" alt="${alt}">`}
function nav(){const list=state.role==='driver'?[['today','Today','home'],['route','Route','route'],['activity','Activity','activity'],['profile','Profile','user']]:[['home','Home','home'],['orders','Orders','box'],['notifications','Updates','bell'],['profile','Profile','user']];return `<nav class="bottom-nav" aria-label="Main navigation">${list.map(([p,l,i])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav>`}
function render(){const auth=['auth','onboarding'].includes(page);document.getElementById('driver-tab').classList.toggle('active',state.role==='driver');document.getElementById('store-tab').classList.toggle('active',state.role==='store');document.getElementById('intro-art').src=ASSET+'mobile/'+(state.role==='driver'?'driver-onboarding-route-ready':'store-onboarding-order-receipt')+'.png';document.getElementById('app').innerHTML=`<header class="appbar"><div class="appbrand"><img src="${ASSET}brand/waypoint-flow-mark.svg" alt="">Waypoint Flow</div><div class="row">${!auth?`<button class="ghost bell" data-page="${state.role==='driver'?'activity':'notifications'}" aria-label="${state.role==='driver'?'Open activity':'Open updates'}">${icon('bell')}</button><button class="avatar" data-page="profile" aria-label="Open profile">${state.role==='driver'?'NP':'AD'}</button>`:pill('App preview','gray')}</div></header>${!storage?'<div class="storage-warning">Device storage is unavailable. Avoid closing this page until you can save your work.</div>':''}${state.offline&&!auth?`<div class="offline-banner">${icon('offline')} Offline demo · Your saved route is available.<br><button data-page="sync">${queued()} records on this phone · View sync centre →</button></div>`:''}<main class="screen" id="screen">${content()}</main>${!auth&&state.role==='driver'&&state.started&&current()>=0&&!['route','pod','success'].includes(page)?`<div class="active-task"><span>${state.parked?'Parked at':'Next stop'} · ${stops[current()].name.split(' · ')[1]}</span><button data-page="route">${state.parked?'Resume delivery':'View route'} ${icon('chevron')}</button></div>`:''}${!auth?nav():''}`;document.title='Waypoint Flow · '+page;}
function go(p){closeSheet();if(p==='pod'&&(!state.parked||current()<0))p='route';page=p;render();document.getElementById('screen').scrollTop=0}
function content(){return ({today,route,activity,sync,profile,home,orders,notifications,tracking,catalogue,orderReview,pod,success,auth,onboarding,receipt:receiptPage}[page]||today)()}
function today(){const n=current();return `<div class="spread" style="margin-bottom:7px"><span class="eyebrow">Tuesday, 21 April</span><button class="ghost" data-page="sync" style="min-height:48px;padding:0">${pill(queued()?queued()+' queued':'Device ready',queued()?'amber':'','refresh')}</button></div>`+heading('Good morning, Nimal','Peliyagoda depot · Morning shift','YOUR DAY, AT A GLANCE')+(state.noRoute?`<div class="card pad empty">${art('no-assigned-trip')}<h2>No route assigned yet</h2><p>Your next route will appear once operations assigns it.</p><button class="secondary full" data-action="refresh">${icon('refresh')}Check for updates</button></div>`:n<0?`<div class="card pad empty">${art('delivery-received')}<h2>That’s a day well delivered.</h2><p>All three stops recorded. Check your activity for any records waiting to sync.</p><button class="primary full" data-page="activity">View delivery records</button></div>`:`<section class="trip-hero"><div class="spread"><span class="eyebrow">YOUR CURRENT TRIP</span>${pill(state.started?'On route':state.released?'Ready to depart':'Awaiting loading','white','check')}</div><h2>WP–012 <span style="font-size:13px;color:#b7d6c4;font-weight:400;letter-spacing:0">/ Trip 1</span></h2><p class="route-name">Peliyagoda → Colombo South</p><div class="trip-stats"><div><strong>03</strong><small>delivery stops</small></div><div class="divider"></div><div><strong>09:15</strong><small>est. finish</small></div><div class="divider"></div><div><strong>78</strong><small>crates & trays</small></div></div><button class="full" data-action="${state.started?'continue':'start'}" ${!state.released?'disabled':''}>${icon(state.started?'nav':'truck')}${state.started?'Continue your route':state.released?'Start trip':'Waiting for loader'}${icon('arrow')}</button><div class="hero-foot">${icon('snow')} Refrigerated · Maintain 2–4°C</div></section><div class="section-title"><h2>Your next stop</h2><button class="text-link" data-page="route">View route ${icon('arrow')}</button></div><section class="card"><div class="next-stop"><div class="stop-number">0${n+1}</div><div><h3>${stops[n].name}</h3><p>${stops[n].address}</p><div style="margin-top:9px">${pill(stops[n].window,'gray','clock')}</div></div>${icon('chevron')}</div><div class="stop-foot">${icon('pin')}Rear receiving bay · Store team expecting you</div></section><div class="ready-card">${icon('shield')}<div><h3>${state.released?'Checked, loaded, ready.':'Your loading team is preparing this trip.'}</h3><p>${state.released?'Manifest verified by Sanath at 06:35 AM. Vehicle temperature confirmed.':'Departure stays locked until the loader releases your vehicle.'}</p><button class="text-link" data-action="manifest">View loading notes ${icon('chevron')}</button></div></div>`)+`<div class="section-title"><h2>Later today</h2>${pill('Trip 2','gray')}</div><div class="card pad"><div class="row">${icon('clock')}<div><h3 style="font-size:13px">Your next assignment</h3><p class="micro muted">Available after Trip 1 completion.</p></div></div></div><p class="micro muted" style="text-align:center">A steady day starts with a safe departure.</p>`}
function map(){return `<div class="map"><svg viewBox="0 0 370 185" role="img" aria-label="Illustrative route to the next outlet"><defs><pattern id="roads" width="68" height="57" patternTransform="rotate(-18)" patternUnits="userSpaceOnUse"><rect width="68" height="57" fill="#e9efe3"/><rect x="6" y="6" width="54" height="42" rx="4" fill="#e0e8d9"/><path d="M0 54H68 M64 0V57" stroke="#fffdf5" stroke-width="7"/></pattern></defs><rect width="370" height="185" fill="url(#roads)"/><path d="M0 0h57l-6 42 16 30-15 52 13 61H0Z" fill="#d1e3df"/><path d="M77 0 123 44 174 66 206 115 257 138 291 185" stroke="#cfdac5" stroke-width="14" fill="none"/><path d="M77 0 123 44 174 66 206 115 257 138 291 185" stroke="#fffdf6" stroke-width="9" fill="none"/><path d="M111 35 174 66 206 115 257 138" stroke="#237953" stroke-width="4" fill="none"/><circle cx="111" cy="35" r="7" fill="#146b45" stroke="white" stroke-width="3"/><circle cx="257" cy="138" r="8" fill="#146b45" stroke="white" stroke-width="3"/><rect x="206" y="93" width="112" height="27" rx="6" fill="white"/><text x="217" y="111" font-family="sans-serif" font-size="11" fill="#146b45">Next delivery stop</text><text x="80" y="148" font-family="sans-serif" font-size="10" fill="#72816b">COLOMBO SOUTH</text></svg><small>Schematic · not live GPS</small></div>`}
function route(){const n=current();if(state.noRoute)return back('Your route','today')+`<div class="empty">${art('no-assigned-trip')}<h2>No assigned route</h2><p>Check back after operations publishes your route.</p><button class="primary full" data-page="today">Back to Today</button></div>`;if(n<0)return back('Your route','today')+`<div class="empty">${art('delivery-received')}<h2>All stops recorded</h2><button class="primary full" data-page="activity">View activity</button></div>`;const s=stops[n];return back('Your route','today')+`${pill(state.parked?'Parked · Delivery mode':state.started?'On route · Travel mode':'Ready for departure',state.parked?'':'gray',state.parked?'check':'truck')}<div style="margin:18px 0"><div class="eyebrow">STOP 0${n+1} OF 03</div><h1 style="font-size:25px;margin:8px 0">${s.name}</h1><p class="small muted">${s.address}</p></div>${map()}<div class="card pad"><div class="spread"><div><div class="eyebrow">ESTIMATED ARRIVAL</div><h2 style="margin-top:6px">${s.eta} AM</h2></div>${pill('On schedule','','clock')}</div><div class="line"><span class="muted">Delivery window</span><strong>${s.window}</strong></div><p class="small muted" style="margin-top:12px">${s.note}</p></div>${state.parked?`<div class="notice">${icon('shield')} You confirmed you’re safely parked. You can now record this delivery.</div><button class="primary full" data-action="pod">${icon('box')}Complete delivery</button><button class="ghost full" data-action="problem">Report a problem</button>`:`<a class="nav-link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address+', Sri Lanka')}">${icon('nav')}Open navigation ${icon('arrow')}</a><div class="actions"><button class="primary full" data-action="${state.started?'park':'start'}">${icon('shield')}${state.started?'I’m safely parked':'Start trip'}</button></div><p class="micro muted" style="margin-top:11px">Open navigation while parked. Stop safely before recording any delivery.</p>`}<div class="section-title"><h2>All stops</h2><span class="small muted">${state.completed.length} / 3 done</span></div><div class="card pad">${stops.map((s,i)=>`<div class="route-stop"><div class="stop-number ${state.completed.includes(i)?'done':''}">${state.completed.includes(i)?icon('check'):'0'+(i+1)}</div><div><h3>${s.name}</h3><p>${state.completed.includes(i)?'Delivery recorded':i===n?'Your next stop':s.window}</p></div></div>`).join('')}</div>`}
function pod(){if(!state.parked||current()<0)return route();return back('Complete delivery','route')+`<div class="step-indicator">${[1,2,3].map(i=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><div class="eyebrow">STEP ${step} OF 3 · ${stops[current()].name}</div><h2 style="margin:12px 0 7px">${['Confirm quantities','Capture the handoff','Review your delivery'][step-1]}</h2><p class="small muted">${['Check the goods against the loaded manifest.','Record who received the goods. Photo is optional.','Check the outcome before saving this stop.'][step-1]}</p><form id="pod-form">${step===1?`${goods.map((g,i)=>`<div class="product"><h3>${g.name}</h3><p>${g.handling} · Expected ${g.expected}</p><div class="spread"><span class="small muted">Delivered</span>${stepper('pod',i,state.pod.qty[i],g.expected)}</div></div>`).join('')}<label class="field">Reason for a quantity difference<select data-pod="reason" ${state.pod.qty.some((q,i)=>q!==goods[i].expected)?'required':''}><option value="">Select if quantities differ</option>${['Missing','Damaged','Refused','Partial unloading'].map(r=>`<option ${state.pod.reason===r?'selected':''}>${r}</option>`).join('')}</select></label>`:step===2?`<label class="field">Recipient name<input data-pod="recipient" value="${esc(state.pod.recipient)}" required maxlength="80" autocomplete="name" placeholder="Who accepted the delivery?"></label><label class="upload">${icon('camera')}${state.pod.photo?'Replace delivery photo':'Add delivery photo (optional)'}<input type="file" id="proof-photo" accept="image/jpeg,image/png,image/webp" capture="environment" aria-label="Delivery photo"></label>${state.pod.photo?`<img class="photo" src="${state.pod.photo}" alt="Delivery evidence preview"><button class="ghost full" type="button" data-action="remove-photo">Remove photo</button>`:''}<p class="micro muted" style="margin-top:8px">JPG, PNG or WebP · Up to 2 MB · Stored on this device.</p><label class="field">Delivery note (optional)<textarea data-pod="note" maxlength="500" placeholder="Receiving instructions or condition notes">${esc(state.pod.note)}</textarea></label>`:`<div class="notice">${state.pod.qty.every((q,i)=>q===goods[i].expected)?'Delivered in full':state.pod.qty.every(q=>q===0)?'Delivery failed — no goods accepted':'Partial delivery'}${state.pod.reason?' · '+esc(state.pod.reason):''}</div><div class="card pad">${goods.map((g,i)=>`<div class="line"><span>${g.name}</span><strong>${state.pod.qty[i]} / ${g.expected}</strong></div>`).join('')}<div class="line"><span>Recipient</span><strong>${esc(state.pod.recipient)}</strong></div><div class="line"><span>Evidence</span><strong>${state.pod.photo?'1 photo':'No photo'}</strong></div></div><p class="small muted">${esc(state.pod.note||'No additional note.')}</p><div class="notice amber">This demo saves the record on this phone. No update is sent to dispatch or the store.</div>`}<div class="actions"><button class="primary full" type="submit">${step===3?'Save delivery record':'Continue'} ${icon(step===3?'check':'arrow')}</button>${step>1?'<button type="button" class="ghost full" data-action="pod-back">Previous step</button>':''}<button type="button" class="ghost full" data-action="save-pod">Save for later</button></div></form>`}
function stepper(kind,i,q,max=99){return `<div class="quantity"><button type="button" data-qty="${kind}" data-index="${i}" data-delta="-1" aria-label="Decrease ${goods[i].name}">−</button><input type="number" min="0" max="${max}" value="${q}" data-number="${kind}" data-index="${i}" aria-label="${kind==='pod'?'Delivered quantity':'Order quantity'} for ${goods[i].name}"><button type="button" data-qty="${kind}" data-index="${i}" data-delta="1" aria-label="Increase ${goods[i].name}">+</button></div>`}
function success(){return `<div class="success">${art('delivery-received')}<div class="eyebrow">ANOTHER HANDOFF, CONNECTED</div><h1>Delivery recorded.</h1><p>The record is saved on this phone.<br>${queued()} ${queued()===1?'record is':'records are'} waiting in the demo sync queue.</p><div class="actions"><button class="primary full" data-page="${current()<0?'today':'route'}">${current()<0?'Back to Today':'Continue to next stop'} ${icon('arrow')}</button><button class="ghost full" data-page="activity">View saved record</button></div></div>`}
function activity(){return heading('Your activity','A clear record of every handoff.','DELIVERY HISTORY')+`<button class="secondary full" data-page="sync">${icon('refresh')}${queued()} records in sync queue ${icon('chevron')}</button>${state.records.filter(r=>['delivery','problem'].includes(r.type)).map(r=>recordCard(r)).join('')||`<div class="empty">${art('no-assigned-trip')}<h2>Your day is taking shape</h2><p>Completed deliveries and reported issues will appear here.</p></div>`}`}
function recordCard(r){return `<article class="sync-list"><div class="spread"><h3>${esc(r.title)}</h3>${icon(r.type==='delivery'?'box':'alert')}</div><p>${esc(r.outcome||r.type)} · ${esc(r.time)}</p>${r.reason?`<p>${esc(r.reason)}</p>`:''}${r.note?`<p>${esc(r.note)}</p>`:''}${r.photo?`<p>1 photo saved</p>`:''}${pill(r.synced?'Demo synced':'Saved on this phone',r.synced?'':'amber',r.synced?'check':'offline')}</article>`}
function sync(){return back('Sync centre',state.role==='driver'?'activity':'profile')+art('offline-records-safe')+`<h1 style="font-size:25px;text-align:center">${state.offline?'Offline. Still moving.':'Your records, together.'}</h1><p class="small muted" style="text-align:center;margin:12px 0">${queued()} queued records are saved on this device.<br>Sync is simulated; there is no server connection.</p><div class="card pad"><div class="spread"><span class="small">Offline demo mode</span><button class="ghost" role="switch" aria-checked="${state.offline}" data-action="offline" aria-label="Offline demo mode"><span class="toggle ${state.offline?'on':''}"></span></button></div><p class="micro muted">Turn this off to try the simulated sync flow.</p></div><button class="primary full" data-action="sync" ${state.offline||!queued()?'disabled':''}>${icon('refresh')}Simulate sync now</button>${state.records.filter(r=>!r.synced).map(recordCard).join('')}<p class="micro muted" style="margin-top:20px">Demo records use browser storage. They are not encrypted or backed up. Use sample details only.</p>`}
function profile(){return heading('Your workspace','','ACCOUNT & PREFERENCES')+`<div class="profile-head"><div class="avatar">${state.role==='driver'?'NP':'AD'}</div><h2>${state.role==='driver'?'Nimal Perera':'Amali De Silva'}</h2><p>${state.role==='driver'?'Driver · Peliyagoda depot':'Store manager · Fresh, Nugegoda'}</p>${pill('Demo account','gray')}</div><div class="card"><button class="menu-row" data-action="switch-role"><span>${icon('user')}Switch to ${state.role==='driver'?'store':'driver'} demo</span>${icon('chevron')}</button><button class="menu-row" data-page="sync"><span>${icon('refresh')}Sync centre</span>${pill(queued()+' queued',queued()?'amber':'gray')}</button><button class="menu-row" data-action="onboarding"><span>${icon('route')}Welcome tour</span>${icon('chevron')}</button><button class="menu-row" data-action="support"><span>${icon('help')}Help & support</span>${icon('chevron')}</button><button class="menu-row" data-page="auth"><span>${icon('logout')}Sign-in preview</span>${icon('chevron')}</button></div>${state.role==='driver'?`<div class="eyebrow" style="margin:22px 0 12px">PREVIEW SCENARIOS</div><div class="card"><button class="menu-row" data-action="assignment" role="switch" aria-checked="${state.noRoute}"><span>No assigned route</span><span class="toggle ${state.noRoute?'on':''}"></span></button><button class="menu-row" data-action="release" role="switch" aria-checked="${state.released}"><span>Loader released vehicle</span><span class="toggle ${state.released?'on':''}"></span></button></div>`:''}<p class="micro muted">Waypoint Flow · Mobile prototype<br>Records stay on this browser. No real messages or dispatch actions are sent.</p>`}
function home(){return heading('Good morning, Amali','Fresh · Nugegoda','YOUR STORE, CONNECTED')+`<div class="trip-hero"><div class="spread"><span class="eyebrow">TODAY’S DELIVERY</span>${pill(state.receipt?'Received':'Delivered','white','check')}</div><h2>${state.receipt?'All received.':'Your order is here.'}</h2><p class="route-name">ORD–2036 · Delivered at 07:20 AM</p><div class="trip-stats"><div><strong>03</strong><small>product lines</small></div><div class="divider"></div><div><strong>26</strong><small>crates & trays</small></div></div><button class="full" data-page="${state.receipt?'tracking':'receipt'}">${icon(state.receipt?'route':'box')}${state.receipt?'View delivery':'Check & confirm receipt'} ${icon('arrow')}</button></div><div class="quick-actions"><button data-page="catalogue">${icon('box')}Create an order</button><button data-page="orders">${icon('clock')}Order history</button></div><div class="notice amber"><strong>Planning tomorrow’s delivery?</strong><br>Submit by 4:00 PM today for the next planning cycle.</div><div class="section-title"><h2>Recent activity</h2><button class="text-link" data-page="notifications">View all</button></div><div class="card pad"><div class="timeline"><div class="timeline-item done"><h3>${state.receipt?'Receipt confirmed':'Delivery ready for review'}</h3><p>${state.receipt?'You confirmed quantities and condition.':'Your order arrived at the receiving bay.'}</p></div><div class="timeline-item done"><h3>Your order left the depot</h3><p>06:45 AM · Delivery on schedule</p></div></div></div>`}
function orders(){return heading('Your orders','From request to receipt.','FRESH · NUGEGODA')+`<button class="primary full" data-page="catalogue">${icon('box')}Create a new order</button><div class="section-title"><h2>Recent orders</h2>${pill(state.orders.length+1+' orders','gray')}</div>${state.orders.map(o=>`<div class="card pad"><div class="spread"><h3>${o.id}</h3>${pill('Awaiting plan','amber')}</div><p class="small muted" style="margin:10px 0">Requested ${esc(o.date)}<br>${o.qty.reduce((a,b)=>a+b,0)} packs · ${esc(o.window)}</p><p class="micro muted">Submitted ${esc(o.time)} · ETA pending planning</p></div>`).join('')}<button class="card pad full" data-page="tracking" style="text-align:left;justify-content:space-between;margin-top:15px"><div><h3>ORD–2036</h3><p class="small muted">21 April · 26 packs</p>${pill(state.receipt?'Receipt confirmed':'Delivered')}</div>${icon('chevron')}</button>`}
function catalogue(){return back('Create an order','orders')+`<div class="notice">Order by 4:00 PM. Requested delivery is subject to fleet planning.</div><label class="field">Delivery date<input id="order-date" type="date" min="2026-04-22" value="${esc(state.orderDate)}" required></label><label class="field">Delivery window<select id="order-window">${['06:00–08:00 AM','08:00–10:00 AM'].map(x=>`<option ${state.orderWindow===x?'selected':''}>${x}</option>`).join('')}</select></label><input class="search-box" id="product-search" placeholder="Search the Fresh catalogue" aria-label="Search products" value="${esc(search)}"><div id="products">${productList()}</div><div class="summary-bar"><strong>Your order</strong><span id="cart-total">${state.cart.reduce((a,b)=>a+b,0)} packs</span></div><div class="actions"><button class="primary full" data-action="review-order">Review order ${icon('arrow')}</button><button class="ghost full" data-action="save-cart">Save draft for later</button></div><p class="micro muted">Your cart is stored on this browser as you make changes.</p>`}
function productList(){const items=goods.map((g,i)=>({g,i})).filter(({g})=>g.name.toLowerCase().includes(search.toLowerCase()));return items.map(({g,i})=>`<div class="product"><h3>${g.name}</h3><p>${g.pack}</p><div class="spread">${pill(g.handling,'','snow')}${stepper('cart',i,state.cart[i])}</div></div>`).join('')||'<div class="empty"><p>No products match your search.</p></div>'}
function orderReview(){return back('Review your order','catalogue')+`<div class="card pad"><h2>Fresh · Nugegoda</h2><p class="small muted" style="margin-top:8px">Requested ${esc(state.orderDate)}<br>${esc(state.orderWindow)}</p>${goods.map((g,i)=>state.cart[i]?`<div class="line"><span>${g.name}</span><strong>${state.cart[i]} packs</strong></div>`:'').join('')}</div><form id="submit-order"><label class="field">PO / reference (optional)<input id="reference" maxlength="60" value="${esc(state.reference)}" placeholder="e.g. NUG-0422"></label><div class="notice amber">This is a delivery request. A confirmed arrival window will be available after planning.</div><button class="primary full" type="submit">Submit order · Demo ${icon('check')}</button></form>`}
function notifications(){return heading('Store updates','The latest on your deliveries.','NOTIFICATIONS')+`<button class="card pad full" data-action="read-update" style="display:block;text-align:left"><div class="spread"><h3>Delivery ready to receive</h3>${pill(state.read?'Read':'New',state.read?'gray':'')}</div><p class="small muted" style="margin-top:8px">ORD–2036 arrived at 07:20 AM. Check the quantities and confirm receipt.</p></button><div class="card pad"><h3>Tomorrow’s order cut-off</h3><p class="small muted" style="margin-top:8px">Send your order by 4:00 PM today to be included in tomorrow’s planning.</p></div>${state.records.filter(r=>r.type==='store issue').map(recordCard).join('')}`}
function tracking(){return back('Order ORD–2036','orders')+pill(state.receipt?'Receipt confirmed':'Delivered','','check')+`<h1 style="font-size:25px;margin:18px 0 10px">Your delivery is here.</h1><p class="small muted">Fresh · Nugegoda · 21 April 2026<br>Delivered at 07:20 AM · Rear receiving bay</p><div class="card pad" style="margin-top:20px"><div class="timeline">${[['Submitted','20 Apr · 02:40 PM'],['Planned','20 Apr · 05:15 PM'],['Loading','21 Apr · 06:20 AM'],['On route','21 Apr · 06:45 AM'],['Delivered','21 Apr · 07:20 AM'],['Receipt confirmed',state.receipt?'Recorded on this device':'Waiting for your review']].map((x,i)=>`<div class="timeline-item ${i<5||state.receipt?'done':''}"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div><button class="primary full" data-page="receipt">${state.receipt?'View receipt':'Check & confirm receipt'}</button><button class="ghost full" data-action="support">Contact operations</button>`}
function receiptPage(){return back('Delivery receipt','tracking')+(state.receipt?`<div class="success">${art('delivery-received')}<h2>Receipt confirmed</h2><p style="margin-top:12px">Recorded by Amali De Silva on this device.</p></div>`:`<h2>Everything as expected?</h2><p class="small muted" style="margin-top:10px">Compare quantities and check the condition of your goods.</p>`)+`<div class="card pad" style="margin-top:20px"><table class="receipt-table"><thead><tr><th>Item</th><th>Ordered</th><th>Delivered</th></tr></thead><tbody>${goods.map(g=>`<tr><td>${g.name}</td><td>${g.expected}</td><td>${g.expected}</td></tr>`).join('')}</tbody></table></div><div class="actions">${!state.receipt?'<button class="primary full" data-action="confirm-receipt">Confirm all items received</button>':''}<button class="full" data-action="store-issue">${icon('alert')}Report an issue</button></div>`}
function onboarding(){return `<section class="onboard"><div class="eyebrow">WELCOME TO WAYPOINT FLOW</div>${art(state.role==='driver'?'driver-onboarding-route-ready':'store-onboarding-order-receipt','Connected delivery workflow','onboard-art')}<h1>${state.role==='driver'?'Your route.<br>Ready when you are.':'Know what’s arriving.<br>And when.'}</h1><p>${state.role==='driver'?'A clear plan for your day, simple delivery records, and handoffs that stay together.':'Place your order, follow its progress, and receive with confidence.'}</p><div class="actions"><button class="primary full" data-page="${state.role==='driver'?'today':'home'}">Explore the demo ${icon('arrow')}</button><button class="ghost full" data-page="auth">Sign-in preview</button></div></section>`}
function auth(){return art('login-route-accent','','auth-art')+heading(authMode==='reset'?'Reset your password':authMode==='activate'?'Activate your account':'Welcome back.','Your team. One connected delivery flow.','WAYPOINT FLOW')+(authMode==='activate'?`<div class="notice">Accounts require an administrator’s invitation. Your role and depot or outlet are assigned by Waypoint.</div><p class="small muted">This prototype does not validate invitation links or create accounts.</p>`:`<form id="auth-form"><label class="field">Work email<input type="email" name="email" required autocomplete="username" placeholder="name@waypoint.lk"></label>${authMode==='signin'?`<label class="field">Password<input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Use a sample password"></label><button class="ghost full" type="button" data-action="password">Show password</button>`:''}<button class="primary full" type="submit" ${state.offline?'disabled':''}>${authMode==='reset'?'Preview reset request':'Enter demo workspace'}</button></form>`)+`${state.offline?'<div class="notice amber">Connect to sign in. In this prototype, turn off offline mode in the Sync centre.</div>':''}<div class="actions"><button class="ghost full" data-auth="${authMode==='signin'?'reset':'signin'}">${authMode==='signin'?'Forgot password?':'Back to sign in'}</button><button class="ghost full" data-auth="activate">Activate account</button><button class="secondary full" data-page="${state.role==='driver'?'today':'home'}">Return to demo</button></div><p class="micro muted">No authentication or email service is connected. Use sample details only.</p>`}
function sheet(title,body){previousFocus=document.activeElement;document.getElementById('modal').innerHTML=`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="spread"><h2 id="sheet-title">${title}</h2><button class="ghost icon-button" data-action="close" aria-label="Close panel">${icon('close')}</button></div>${body}</section></div>`;document.getElementById('app').setAttribute('inert','');document.querySelector('.sheet button').focus()}
function closeSheet(){document.getElementById('modal').innerHTML='';document.getElementById('app').removeAttribute('inert');if(previousFocus?.isConnected)previousFocus.focus()}
function switchRole(role){state.role=role;persist();go(role==='driver'?'today':'home')}
function issueForm(store=false){sheet(store?'Report a receipt issue':'Report a delivery problem',`<form id="issue-form" data-store="${store}"><label class="field">Affected item<select name="item" data-issue="item">${goods.map(g=>`<option ${state.issue.item===g.name?'selected':''}>${g.name}</option>`).join('')}</select></label><label class="field">Issue category<select name="type" data-issue="type">${['Missing goods','Damage','Temperature concern','Access blocked','Delivery refused','Other'].map(s=>`<option ${state.issue.type===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">What happened?<textarea name="note" data-issue="note" required maxlength="500">${esc(state.issue.note)}</textarea></label>${!store?'<label class="check-label"><input type="checkbox" name="skip">Mark this stop as failed and continue to the next stop.</label>':''}<p>This records the issue locally. No actual notification is sent.</p><button class="primary full">Save issue on this phone</button></form>`)}
document.addEventListener('click',e=>{if(e.target.classList.contains('sheet-backdrop'))closeSheet();const b=e.target.closest('button');if(!b)return;if(b.dataset.role)return switchRole(b.dataset.role);if(b.dataset.page)return go(b.dataset.page);if(b.dataset.auth){authMode=b.dataset.auth;return render()}if(b.dataset.qty){const i=+b.dataset.index,kind=b.dataset.qty,max=kind==='pod'?goods[i].expected:99;const arr=kind==='pod'?state.pod.qty:state.cart;arr[i]=Math.max(0,Math.min(max,arr[i]+ +b.dataset.delta));persist();const pos=document.getElementById('screen').scrollTop;render();document.getElementById('screen').scrollTop=pos;return}const a=b.dataset.action;
if(a==='close')closeSheet();if(a==='continue')go('route');if(a==='start'){if(!state.released||state.noRoute)return;sheet('Ready for the road?',`<p>Review your route and vehicle checks before setting off.</p><form id="start-form"><label class="check-label"><input type="checkbox" required>I’m safely parked and ready to begin this trip.</label><button class="primary full">Confirm & start trip</button></form>`)}if(a==='park'){sheet('Safely parked?',`<p>Confirm the vehicle is stopped in a safe place before recording the delivery.</p><button class="primary full" data-action="confirm-park">Yes, I’m safely parked</button>`)}if(a==='confirm-park'){state.parked=true;persist();go('route')}if(a==='pod'){if(!state.parked)return;step=1;go('pod')}if(a==='pod-back'){step=Math.max(1,step-1);render()}if(a==='save-pod'){if(persist()){notify('Delivery draft saved on this phone.');go('route')}else notify('Could not save this draft. Free device storage and retry.')}if(a==='remove-photo'){state.pod.photo='';persist();render()}if(a==='offline'){state.offline=!state.offline;persist();render()}if(a==='sync'){if(state.offline)return;const before=structuredClone(state.records);state.records.forEach(r=>r.synced=true);if(!persist()){state.records=before;return notify('Could not save sync status. Try again.')}render();notify('Demo sync complete. No records were sent to a server.')}if(a==='switch-role')switchRole(state.role==='driver'?'store':'driver');if(a==='assignment'){state.noRoute=!state.noRoute;if(state.noRoute){state.started=false;state.parked=false;}persist();render()}if(a==='release'){if(state.started)return notify('This trip has already started.');state.released=!state.released;persist();render()}if(a==='onboarding')go('onboarding');if(a==='refresh')notify('Demo refreshed. Change assignment in Profile → Preview scenarios.');if(a==='manifest')sheet('Loading notes',`<p>WP–012 · Trip 1 · Peliyagoda depot<br>Sample manifest: 26 packs per stop · 78 packs total</p><div class="notice">Manifest checked by Sanath · 06:35 AM<br>Vehicle clean · Load secured · Temperature 2–4°C</div>${goods.map(g=>`<div class="line"><span>${g.name}</span><strong>${g.expected}</strong></div>`).join('')}<p>Delivery order: Nugegoda → Maharagama → Kottawa. Loaded in reverse stop order.</p>`);if(a==='support')sheet('Operations support',`<p>For a delivery discrepancy, use “Report a problem” or “Report an issue” to keep the details with the order.</p><div class="notice">This prototype has no connected operations desk. All records are saved locally on your browser.</div><button class="primary full" data-action="close">Got it</button>`);if(a==='problem'){if(state.parked)issueForm(false)}if(a==='store-issue')issueForm(true);if(a==='review-order'){const date=document.getElementById('order-date');if(!date.reportValidity())return;if(!state.cart.some(Boolean))return notify('Add at least one product to your order.');go('orderReview')}if(a==='save-cart'){if(persist())notify('Order draft saved on this browser.');else notify('Could not save the cart. Device storage is unavailable.')}if(a==='read-update'){state.read=true;persist();go('tracking')}if(a==='confirm-receipt')sheet('Confirm your receipt',`<p>You’re confirming that all 26 packs arrived in the expected condition.</p><button class="primary full" data-action="save-receipt">Confirm all items received</button><button class="ghost full" data-action="store-issue">Report a discrepancy instead</button>`);if(a==='save-receipt'){if(state.receipt)return;state.receipt=true;if(!record('receipt','ORD–2036 · Receipt confirmed',{note:'All 26 packs accepted by Amali De Silva.'})){state.receipt=false;return}closeSheet();go('receipt');notify('Receipt saved on this phone.')}if(a==='password'){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show password':'Hide password'}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pod&&t.tagName!=='SELECT'){state.pod[t.dataset.pod]=t.value;persist()}if(t.dataset.issue){state.issue[t.dataset.issue]=t.value;persist()}if(t.id==='reference'){state.reference=t.value;persist()}if(t.id==='product-search'){search=t.value;document.getElementById('products').innerHTML=productList()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pod){state.pod[t.dataset.pod]=t.value;persist()}if(t.dataset.issue){state.issue[t.dataset.issue]=t.value;persist()}if(t.dataset.number){const i=+t.dataset.index,max=t.dataset.number==='pod'?goods[i].expected:99,q=Math.max(0,Math.min(max,Math.floor(Number(t.value)||0)));(t.dataset.number==='pod'?state.pod.qty:state.cart)[i]=q;t.value=q;persist();if(t.dataset.number==='cart')document.getElementById('cart-total').textContent=state.cart.reduce((a,b)=>a+b,0)+' packs'}if(t.id==='order-date'){state.orderDate=t.value;persist()}if(t.id==='order-window'){state.orderWindow=t.value;persist()}if(t.id==='proof-photo'){const file=t.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2*1024*1024){t.value='';return notify('Choose a JPG, PNG or WebP image under 2 MB.')}const reader=new FileReader();reader.onload=()=>{const old=state.pod.photo;state.pod.photo=reader.result;if(!persist()){state.pod.photo=old;notify('Photo could not be saved. Try a smaller image.')}render()};reader.readAsDataURL(file)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='start-form'){state.started=true;state.parked=false;persist();go('route');notify('Trip started. Stop safely before recording a delivery.')}if(f.id==='pod-form'){if(!state.parked||current()<0)return;if(step===1&&state.pod.qty.some((q,i)=>q!==goods[i].expected)&&!state.pod.reason)return notify('Choose a reason for the quantity difference.');if(step<3){step++;render();document.getElementById('screen').scrollTop=0;return}if(!state.pod.recipient.trim())return notify('Add the recipient name before saving.');const n=current(),old=structuredClone(state.pod);state.completed.push(n);state.parked=false;state.pod=fresh().pod;const outcome=old.qty.every((q,i)=>q===goods[i].expected)?'Delivered in full':old.qty.every(q=>q===0)?'Delivery failed':'Partial delivery';if(!record('delivery',stops[n].name,{...old,outcome})){state.completed=state.completed.filter(i=>i!==n);state.parked=true;state.pod=old;return}go('success')}if(f.id==='submit-order'){if(!state.cart.some(Boolean))return;const o={id:'ORD–'+(2051+state.orders.length),date:state.orderDate,window:state.orderWindow,qty:[...state.cart],reference:state.reference,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};state.orders.unshift(o);const oldCart=[...state.cart];state.cart=[0,0,0];if(!record('order',o.id+' · Awaiting plan',{note:'Requested '+o.date})){state.orders.shift();state.cart=oldCart;return}go('orders');notify('Order saved — awaiting plan in this demo.')}if(f.id==='issue-form'){const store=f.dataset.store==='true',n=current(),skip=d.has('skip');if(!store&&(!state.parked||n<0))return;if(!record(store?'store issue':'problem',store?'ORD–2036 · '+d.get('item'):stops[n].name,{reason:d.get('type'),note:d.get('note'),outcome:skip?'Delivery failed':'Issue reported'}))return;if(skip){state.completed.push(n);state.parked=false;state.pod=fresh().pod;persist()}state.issue=fresh().issue;persist();go(store?'notifications':'route');notify('Issue saved on this phone.')}if(f.id==='auth-form'){if(state.offline)return;if(authMode==='reset'){sheet('Reset request preview',`<p>If this address were registered, reset instructions would be sent.</p><div class="notice">Demo only: no email was sent.</div><button class="primary full" data-action="close">Done</button>`)}else go(state.role==='driver'?'today':'home')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&document.querySelector('.sheet')){const list=[...document.querySelectorAll('.sheet button:not(:disabled),.sheet input,.sheet select,.sheet textarea')],first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
</body>
</html>
