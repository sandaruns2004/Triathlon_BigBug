name: Mobile protected iOS release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    environment: mobile-ios-production
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: waypoint-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: python3 scripts/check_ios_configuration.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --flavor development
      - name: Install authorized distribution identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cert=root/'waypoint-distribution.p12'
          cert.write_bytes(base64.b64decode(os.environ['CERTIFICATE_BASE64'],validate=True))
          cert.chmod(0o600)
          chain=str(root/'waypoint-signing.keychain-db')
          def security(*args):
              result=subprocess.run(['security',*args],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode: raise SystemExit('Temporary signing keychain setup failed')
          password=os.environ['KEYCHAIN_PASSWORD']
          if not password: raise SystemExit('Missing protected keychain password')
          security('create-keychain','-p',password,chain)
          security('set-keychain-settings','-lut','21600',chain)
          security('unlock-keychain','-p',password,chain)
          security('import',str(cert),'-P',os.environ['CERTIFICATE_PASSWORD'],'-k',chain,'-T','/usr/bin/codesign')
          security('set-key-partition-list','-S','apple-tool:,apple:,codesign:','-k',password,chain)
          security('list-keychains','-d','user','-s',chain,str(pathlib.Path.home()/'Library/Keychains/login.keychain-db'))
          PY
      - name: Validate and prepare protected Apple configuration
        env:
          IOS_CLIENT_CONFIGURATION: ${{ secrets.IOS_PRODUCTION_CONFIG }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_SHA1: ${{ secrets.IOS_SIGNING_CERTIFICATE_SHA1 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: python3 scripts/prepare_ios_release.py
      - run: flutter build ipa --release --flavor production --dart-define-from-file=config/ios-production.json --export-options-plist=ios/ExportOptions.local.plist
      - name: Record IPA checksums
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          files=list(pathlib.Path('build/ios/ipa').glob('*.ipa'))
          if not files: raise SystemExit('No signed IPA exported')
          pathlib.Path('release-ios-checksums.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f)+'\n' for f in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-production-signed-ipa
          path: |
            waypoint-mobile/build/ios/ipa/*.ipa
            waypoint-mobile/build/ios/archive/Runner.xcarchive/dSYMs/**
            waypoint-mobile/release-ios-checksums.txt
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, json
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])
          subprocess.run(['security','delete-keychain',str(temporary/'waypoint-signing.keychain-db')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          marker=temporary/'waypoint-profile-path.txt'
          if marker.exists():
              allowed={(pathlib.Path.home()/d).resolve() for d in ['Library/MobileDevice/Provisioning Profiles','Library/Developer/Xcode/UserData/Provisioning Profiles']}
              for name in json.loads(marker.read_text()):
                  profile=pathlib.Path(name).resolve()
                  if profile.parent in allowed: profile.unlink(missing_ok=True)
          for name in ['waypoint-distribution.p12','waypoint.mobileprovision','waypoint-profile-path.txt']:
              (temporary/name).unlink(missing_ok=True)
          for name in ['ios/Flutter/Signing.local.xcconfig','ios/ExportOptions.local.plist','config/ios-production.json']:
              pathlib.Path(name).unlink(missing_ok=True)
          PY
