name: Mobile verification
on:
  push:
    paths: ['waypoint-mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['waypoint-mobile/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waypoint-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --flavor development
  android-artifact:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waypoint-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --flavor development --dart-define-from-file=config/development.json
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-development-apk
          path: waypoint-mobile/build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error
